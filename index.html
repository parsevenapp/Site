<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری حرفه‌ای</title>
    <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body>

    <div class="neon-header-box">
        <h1 class="flicker-text">به سایت گالری خوش آمدید</h1>
    </div>

    <div class="control-bar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="جستجوی محصول..." onkeyup="doSearch()">
        </div>
        <button id="viewToggle" class="toggle-btn" onclick="toggleView()">حالت نمایش: گرید</button>
    </div>

    <div class="list-title">
        <h2>لیست محصولات</h2>
    </div>

    <div class="main-wrapper">
        <aside class="sidebar-nav">
            <div id="cat-buttons"></div>
        </aside>

        <main class="content-area">
            <div id="product-container" class="grid-display"></div>
        </main>
    </div>

    <footer class="neon-footer">
        <div id="footer-content">
            <div class="footer-item" id="f-addr">آدرس: * * * * *</div>
            <div class="footer-item" id="f-phone">تلفن: * * * * *</div>
            <div class="footer-socials">
                <a href="#" id="f-insta" class="social-link">اینستاگرام</a>
                <span class="divider">|</span>
                <a href="#" id="f-tele" class="social-link">تلگرام</a>
            </div>
        </div>
        <button onclick="adminPanel()" class="admin-btn">⚙️ مدیریت سایت</button>
    </footer>

    <script src="script.js?v=5.0"></script>
</body>
</html>
