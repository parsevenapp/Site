<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری آنلاین</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="welcome-banner">
        <h1 class="animate-text">به سایت گالری خوش آمدید</h1>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="جستجوی محصول مورد نظر..." onkeyup="searchProduct()">
    </div>

    <div class="main-container">
        <aside class="sidebar">
            <h2>دسته‌بندی‌ها</h2>
            <div id="category-list"></div>
        </aside>

        <main class="content">
            <h2 id="category-title">همه محصولات</h2>
            <div id="product-grid" class="product-grid"></div>
        </main>
    </div>

    <footer>
        <div class="footer-info">
            <div class="footer-section">
                <h4>ارتباط با ما</h4>
                <p>آدرس: تهران، بازار بزرگ</p>
                <p>تلفن: ۰۲۱۱۲۳۴۵۶۷۸</p>
            </div>
            <div class="footer-section">
                <h4>شبکه‌های اجتماعی</h4>
                <div class="social-links">
                    <a href="#">اینستاگرام</a> | <a href="#">تلگرام</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
